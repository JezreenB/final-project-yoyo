<script>
async function logout() {
    showPopupMessage("Are you sure you want to log out?", async function(confirmed) {
        if (confirmed) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/users/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    localStorage.removeItem('token');
                    window.location.href = "auth.html";
                } else {
                    alert('Logout failed');
                }
            } catch (error) {
                alert('Logout error: ' + error.message);
            }
        }
    });
}

// Function to show popup message with animation and transition
function showPopupMessage(message, callback) {
    // Create overlay
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';

    // Create popup container
    const popup = document.createElement('div');
    popup.className = 'popup-message';

    // Message text
    const msg = document.createElement('p');
    msg.textContent = message;
    popup.appendChild(msg);

    // Buttons container
    const btnContainer = document.createElement('div');
    btnContainer.className = 'popup-buttons';

    // Yes button
    const yesBtn = document.createElement('button');
    yesBtn.textContent = 'Yes';
    yesBtn.className = 'btn btn-primary';
    yesBtn.onclick = () => {
        closePopup();
        callback(true);
    };

    // No button
    const noBtn = document.createElement('button');
    noBtn.textContent = 'No';
    noBtn.className = 'btn btn-secondary';
    noBtn.onclick = () => {
        closePopup();
        callback(false);
    };

    btnContainer.appendChild(yesBtn);
    btnContainer.appendChild(noBtn);
    popup.appendChild(btnContainer);
    document.body.appendChild(overlay);
    document.body.appendChild(popup);

    // Animate popup and overlay
    setTimeout(() => {
        overlay.classList.add('show');
        popup.classList.add('show');
    }, 10);

    // Close popup function
    function closePopup() {
        popup.classList.remove('show');
        overlay.classList.remove('show');
        setTimeout(() => {
            document.body.removeChild(popup);
            document.body.removeChild(overlay);
        }, 300);
    }
}

    <script>
        // Add updateOrderStatus function to update badge classes dynamically
        function updateOrderStatus() {
            const statusSelect = document.getElementById('orderStatus');
            const notes = document.getElementById('statusNotes').value;
            const updateStatusForm = document.getElementById('updateStatusForm');
            const orderId = updateStatusForm.dataset.orderId;

            if (!statusSelect.value) {
                alert('Please select a status');
                return;
            }

            // Find the order row by orderId
            const row = [...document.querySelectorAll('#ordersTableBody tr')].find(r => r.cells[0].textContent.trim() === orderId);
            if (row) {
                const badge = row.cells[4].querySelector('span');
                badge.textContent = statusSelect.value.charAt(0).toUpperCase() + statusSelect.value.slice(1);
                badge.className = 'badge';

                // Update badge class based on status
                switch (statusSelect.value) {
                    case 'order placed':
                        badge.classList.add('badge-order-placed');
                        break;
                    case 'order processed':
                        badge.classList.add('badge-order-processed');
                        break;
                    case 'processing':
                        badge.classList.add('badge-processing');
                        break;
                    case 'shipped':
                        badge.classList.add('badge-shipped');
                        break;
                    case 'out for delivery':
                        badge.classList.add('badge-out-for-delivery');
                        break;
                    case 'delivered':
                        badge.classList.add('badge-delivered');
                        break;
                    case 'cancelled':
                        badge.classList.add('badge-cancelled');
                        break;
                    default:
                        badge.classList.add('badge-secondary');
                }
            }

            // Close the modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('updateStatusModal'));
            modal.hide();
        }
    </script>
